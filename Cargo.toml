[workspace]
resolver = "2"
members = [
    "crates/gw",
    "crates/gw-core",
    "crates/gw-plugin-protocol",
    "crates/providers/*",
]

[workspace.package]
edition = "2021"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "5"
futures = "0.3"
notify = "6"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
toml_edit = "0.22"
tui-term = { version = "0.3.4", default-features = false, features = ["vt100"] }
unicode-width = "0.2"
vt100 = "0.16.2"

gw-core = { path = "crates/gw-core" }
gw-plugin-protocol = { path = "crates/gw-plugin-protocol" }
