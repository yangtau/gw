[workspace]
resolver = "2"
members = [
    "crates/gw",
    "crates/gw-core",
    "crates/gw-plugin-protocol",
    "crates/providers/*",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/yangtau/gw"
homepage = "https://github.com/yangtau/gw"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "5"
futures = "0.3"
notify = "6"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
toml_edit = "0.22"
unicode-width = "0.2"

gw-core = { path = "crates/gw-core" }
gw-plugin-protocol = { path = "crates/gw-plugin-protocol" }
gw-provider-sdk = { path = "crates/providers/sdk" }
