name: Bug report
description: Report a reproducible problem in gw
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include raw hook payloads, transcripts, credentials, or private source code.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of steps that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gw version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, tmux version, and affected provider/version.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include sanitized logs only when necessary.
