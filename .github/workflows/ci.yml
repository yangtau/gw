name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  bins:
    name: Prebuilt bins stay in sync
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.bins }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          python3 .nix/check-prebuilt-bins.py
          echo "bins=$(jq -r 'join(" ")' .nix/bins.json)" >> "$GITHUB_OUTPUT"

  prebuilt:
    name: Publish prebuilt
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push'
              && !contains(github.event.head_commit.message, 'record prebuilt hashes')))
    needs: [test, lint, bins]
    permissions:
      contents: write
    uses: yangtau/nix-rust-prebuilt/.github/workflows/publish.yml@main
    with:
      name: gw
      hashes-path: .nix/prebuilt-hashes.json
      bins: ${{ needs.bins.outputs.list }}
    secrets: inherit
